name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    outputs:
      asset: ${{ steps.asset.outputs.path }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Run automated tests
        run: npm test

      - name: Check TypeScript
        run: npm run typecheck

      - name: Build application
        run: npm run build

      - name: Identify built JavaScript
        id: asset
        run: node -e 'const fs=require("fs"); const html=fs.readFileSync("dist/index.html","utf8"); const match=html.match(/src="([^"]+\.js)"/); if(!match)process.exit(1); fs.appendFileSync(process.env.GITHUB_OUTPUT,"path="+match[1]+"\n");'

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  live-smoke:
    if: github.ref == 'refs/heads/main'
    needs: [build, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Install browser test tooling
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify published build and live user flow
        env:
          LIVE_URL: ${{ needs.deploy.outputs.page_url }}
          EXPECTED_ASSET: ${{ needs.build.outputs.asset }}
        run: node scripts/live-smoke.mjs
      - name: Preserve live verification screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-smoke-${{ github.sha }}
          path: .mvp-smoke/
          if-no-files-found: ignore
